name: macOS Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0)'
        required: true
        default: 'v6.5'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # 用两个不同架构的 runner 分别构建单架构 app
    # macos-15-intel = Intel (x86_64), macos-15 = Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    env:
      # 保证构建产物最低支持 macOS 12.x（用户机器为 macOS 12）
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
          - arch: arm64
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(git describe --tags)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build App (${{ matrix.arch }})
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          # 更新应用版本号
          sed -i "" "s/v0.0.0/$VERSION/g" ./main.py
          sed -i "" "s/v0.0.0/$VERSION/g" ./setup.py

          # 生成 UI 文件
          pyuic5 -o ui.py main.ui
          pyrcc5 -o resource_rc.py resource.qrc

          # 关键：显式指定当前运行器对应的架构
          python setup.py py2app --no-strip --no-chdir --arch=${{ matrix.arch }}

          # 校验主可执行文件的架构
          file dist/cloud-clipboard-go.app/Contents/MacOS/cloud-clipboard-go

      - name: Upload App (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.arch }}
          path: dist/cloud-clipboard-go.app
          retention-days: 1

  merge:
    name: Create Universal App
    needs: [build]
    # 在 Apple Silicon runner 上合并，两个 slice 都能处理
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download App (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: app-x86_64
          path: apps-x86_64

      - name: Download App (arm64)
        uses: actions/download-artifact@v8
        with:
          name: app-arm64
          path: apps-arm64

      - name: Merge with lipo
        run: |
          set -e

          # 不依赖固定的解压布局，用 find 定位 .app 目录
          ARM_APP=$(find "$PWD/apps-arm64" -maxdepth 2 -type d -name "*.app" | head -1)
          X86_APP=$(find "$PWD/apps-x86_64" -maxdepth 2 -type d -name "*.app" | head -1)
          # upload-artifact 可能只保留了 .app 的内容(Contents/...)，此时把下载目录本身当作 app 包
          if [ -z "$ARM_APP" ] && [ -d "$PWD/apps-arm64/Contents" ]; then
            ARM_APP="$PWD/apps-arm64"
          fi
          if [ -z "$X86_APP" ] && [ -d "$PWD/apps-x86_64/Contents" ]; then
            X86_APP="$PWD/apps-x86_64"
          fi
          echo "arm64 app: $ARM_APP"
          echo "x86_64 app: $X86_APP"
          if [ -z "$ARM_APP" ] || [ -z "$X86_APP" ] || [ ! -f "$ARM_APP/Contents/MacOS/cloud-clipboard-go" ] || [ ! -f "$X86_APP/Contents/MacOS/cloud-clipboard-go" ]; then
            echo "错误：未找到 .app 目录"
            echo "--- apps-arm64 ---"; find apps-arm64 -maxdepth 2
            echo "--- apps-x86_64 ---"; find apps-x86_64 -maxdepth 2
            exit 1
          fi

          # 校验两个 app 的主可执行文件架构正确
          echo "=== 各架构主可执行文件 ==="
          file "$ARM_APP/Contents/MacOS/cloud-clipboard-go"
          file "$X86_APP/Contents/MacOS/cloud-clipboard-go"

          # 以 arm64 为基础
          MERGED="$PWD/apps/merged.app"
          mkdir -p "$PWD/apps"
          cp -R "$ARM_APP" "$MERGED"

          # 遍历基础 app 下所有文件，把其中的 Mach-O 二进制与 x86_64 版本用 lipo 合并
          while IFS= read -r f; do
            rel="${f#"${MERGED}"/}"
            other="${X86_APP}/${rel}"
            # 只处理两处都存在且确实是 Mach-O 二进制的文件
            if [ -f "$other" ] && file -b "$f" | grep -q "Mach-O"; then
              # 跳过符号链接（避免破坏框架内的软链）
              if [ -L "$f" ]; then
                continue
              fi
              if file -b "$f" | grep -q "universal"; then
                echo "已是最新: $rel"
              else
                lipo -create "$f" "$other" -output "$f"
                echo "合并: $rel"
              fi
            else
              echo "跳过: $rel"
            fi
          done < <(find "$MERGED" -type f)

          echo "=== 校验合并后的主可执行文件 ==="
          lipo -archs "$MERGED/Contents/MacOS/cloud-clipboard-go"
          lipo -info "$MERGED/Contents/MacOS/cloud-clipboard-go"

      - name: Create DMG
        run: |
          brew install create-dmg >/dev/null 2>&1 || true
          mkdir -p staging
          cp -R apps/merged.app staging/cloud-clipboard-go.app

          create-dmg \
            --volname "cloud-clipboard-go" \
            --volicon "icon.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "cloud-clipboard-go.app" 175 190 \
            --hide-extension "cloud-clipboard-go.app" \
            --app-drop-link 425 190 \
            "cloud-clipboard-go-${{ needs.build.outputs.version }}-macOS-universal.dmg" \
            staging/

      - name: Create ZIP backup
        run: |
          mkdir -p dist
          cp -R apps/merged.app dist/cloud-clipboard-go.app
          cd dist
          zip -r "../cloud-clipboard-go-${{ needs.build.outputs.version }}-macOS-universal.zip" cloud-clipboard-go.app
          cd ..
          rm -rf dist

      - name: Calculate SHA256
        id: sha256
        run: |
          DMG_PATH="cloud-clipboard-go-${{ needs.build.outputs.version }}-macOS-universal.dmg"
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "sha256_value=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Store SHA256 for Homebrew Tap
        run: |
          mkdir -p artifact
          echo "${{ steps.sha256.outputs.sha256_value }}" > artifact/sha256.txt
          echo "${{ needs.build.outputs.version }}" > artifact/version.txt

      - name: Upload SHA256 and Version
        uses: actions/upload-artifact@v7
        with:
          name: artifact-info
          path: artifact/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: |
            cloud-clipboard-go-*-universal.dmg
            cloud-clipboard-go-*-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: [merge]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-info
          path: ./artifact

      - name: Update Tap Repository
        run: |
          VERSION=$(cat ./artifact/version.txt)
          SHA256=$(cat ./artifact/sha256.txt)

          echo "Updating to version: $VERSION"
          echo "SHA256: $SHA256"

          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/jonnyan404/homebrew-tap.git
          cd homebrew-tap

          mkdir -p Casks

          cat ../homebrew/cloud-clipboard-go.rb.template | \
            sed "s/VERSION_PLACEHOLDER/$VERSION/g" | \
            sed "s/SHA256_PLACEHOLDER/$SHA256/g" > \
            Casks/cloud-clipboard-go.rb

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add Casks/cloud-clipboard-go.rb
          if ! git diff --staged --quiet; then
            git commit -m "Update cloud-clipboard-go to $VERSION"
            git push
          else
            echo "No changes to commit."
          fi
