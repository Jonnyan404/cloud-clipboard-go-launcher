name: Windows Release

on:
  push:
    tags:
      - '*'
  # 添加手动触发选项
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0)'
        required: true
        default: 'v6.6'

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.arch }})
    # 分架构构建，覆盖 x86_64 与 arm64
    # windows-11-vs2026-arm = arm64, windows-latest = x86_64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
          - arch: arm64
            os: windows-11-vs2026-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Build
        run: |
          # 版本号：手动触发用输入，tag 触发用 tag 名
          $VERSION = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          (Get-Content -Path ./main.py) -replace 'v0.0.0', $VERSION | Set-Content -Path ./main.py
          pip install -r requirements.txt
          pyside6-uic main.ui -o ui.py
          pyside6-rcc resource.qrc -o resource_rc.py
          pip install pyinstaller
          pyinstaller --noconsole -F ./main.py --icon icon.png -n cloud-clipboard-go-launcher-${{ matrix.arch }}.exe
          
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          # 手动触发时按输入版本号附加到对应 release；tag 触发时用触发 tag
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: dist/cloud-clipboard-go-launcher-${{ matrix.arch }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
