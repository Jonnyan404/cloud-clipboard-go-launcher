name: Linux Release

on:
  push:
    tags:
      - '*'
  # 添加手动触发选项
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0)'
        required: true
        default: 'v6.6'

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.arch }})
    # 分架构构建，覆盖 x86_64 (amd64) 与 arm64
    # ubuntu-24.04-arm = arm64, ubuntu-latest = x86_64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx python3-dev \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libegl1 \
            libqt5gui5
          
      - name: Build
        run: |
          VERSION=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || format('{0}', github.ref_name) }}
          sed -i "s/v0.0.0/$VERSION/g" ./main.py
          
          pip install -r requirements.txt
          pip install pyinstaller
          
          # 生成必要的 UI 文件
          pyside6-uic main.ui -o ui.py
          pyside6-rcc resource.qrc -o resource_rc.py
          
          # 构建可执行文件 - 添加所有缺失的库
          # 启动器二进制命名为 cloud-clipboard-go-launcher，避免与下载的核心程序 cloud-clipboard-go 重名
          pyinstaller --noconsole -F \
            --add-data="icon.png:." \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --icon=icon.png \
            -n cloud-clipboard-go-launcher \
            ./main.py

          # 校验产物架构
          file dist/cloud-clipboard-go-launcher
          
      - name: Package for Linux
        run: |
          VERSION=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          cd dist
          tar -czvf "cloud-clipboard-go-$VERSION-Linux-${{ matrix.arch }}.tar.gz" cloud-clipboard-go-launcher
          cd ..
          
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          # 手动触发时按输入版本号附加到对应 release；tag 触发时用触发 tag
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: |
            dist/cloud-clipboard-go-*-Linux-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}